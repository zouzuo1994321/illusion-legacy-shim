; dgVoodoo2 v2.87.5 configuration for 电车之狼VR (IPVR.exe, Illusion, 2001, DirectDraw)
; 用途：让 2001 年的 DirectDraw 老游戏在现代 Windows 11 上稳定运行
;
; 关键设置说明：
;  - IPVR.exe 只导入 ddraw.dll（DirectDraw），不含 d3d9.dll 调用
;    → 本方案的核心是 ddraw.dll（DirectDraw → D3D11 翻译）
;  - OutputAPI = d3d11_fl11_0  → 输出到现代 D3D11，兼容性最好
;  - FullscreenAttributes = fake → 不真的切换显示器分辨率，
;    避免老游戏请求 640x480 全屏与 2560x1440@165Hz 冲突导致设备丢失而闪退
;  - WindowedAttributes = borderless → 无边框窗口
;  - DisableAltEnterToToggleScreenMode = true → 禁用 Alt+Enter 独占全屏
;  - AppControlledScreenMode = false → 由 dgVoodoo 接管分辨率，忽略游戏请求

[dgVoodoo]
Version                    = 3
OutputAPI                  = d3d11_fl11_0
FullScreenOutput           = default
FullScreenMode             = false
ScalingMode                = stretched_ar
EnumerateRefreshRates      = false
Brightness                 = 1.0
Color                      = 1.0
Contrast                   = 1.0
InheritColorProfileInFullScreenMode = false
KeepWindowAspectRatio      = true
CaptureMouse                = false
CenterAppWindow            = true
DisableAltEnterToToggleScreenMode = true
AppControlledScreenMode     = false
DisableDefaultResolutions   = false
PresentationModel           = flip_discard
ImageScaleFactor            = 1
MSD3DDeviceNames            = false
RTTexturesForceScaleAndMSAA = false

[General]
WindowedAttributes          = borderless
FullscreenAttributes        = fake
EnableGDIHooking            = true
Environment                 =
FPSLimit                    = 60
SystemHookFlags             =
Adapters                    = all
SplashScreen                = false

[DirectX]
VideoMemorySize             = 512
Dithering                   = true
EnableVSync                 = true
Antialiasing                = appdriven
AnisotropicFiltering        = appdriven

[DirectDraw]
; 老 DirectDraw 游戏的关键兼容项
;  - Resolution = 4x  → 把 640x480 放大 4 倍显示（2560x1920），保持像素清晰
;  - dgVoodooWatermark = false → 不显示 dgVoodoo 水印
;  - EmulatePCX = false → 老游戏用自有格式，无需 PCX 模拟
;  - Dithering 保持默认，老游戏依赖抖动来呈现渐变
VideoMemorySize             = 512
Dithering                   = true
EnableVSync                 = true
Antialiasing                = appdriven
AnisotropicFiltering        = appdriven
Resolution                  = 4x
EmulatePCX                  = false
dgVoodooWatermark           = false

[Debug]
Debug                       = false
LogToFile                   = false
MaxTraceLevel               = error
EnableBreak                 = false
