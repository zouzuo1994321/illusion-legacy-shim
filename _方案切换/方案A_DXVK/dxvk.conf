# ==========================================================
#  dxvk.conf  —  RapeLay (Illusion / 2006 / Direct3D 9)
#  环境：Windows 11 + NVIDIA RTX 40 系 + DXVK 2.4.1
#  作用：把老游戏的 D3D9 调用翻译成 Vulkan，绕过
#        Win11 已删除/不再支持的 D3D9 老特性，解决闪退。
# ==========================================================

# ---------- 日志 ----------
# 稳定后可把下面这行改成 none 关闭日志
dxvk.logLevel = info

# ---------- 显示模式（核心修复项）----------
# 原游戏会请求「全屏独占 1280x960」，而你的主显示器是
# 2560x1440@165Hz。DXVK 在 165Hz 显示器上切换老全屏模式
# 会连续 Reset 两次 swapchain，第二次 165Hz 模式设置失败，
# 导致设备丢失 → 进程直接退出（表现为闪退）。
#
# 解法 A（默认，推荐）：让 DXVK 用无边框窗口呈现，不再切换
# 显示器刷新率/分辨率。既避免闪退，又能保留 1080p/1440p 清晰度。
d3d9.deferSurfaceCreation = True
d3d9.numBackBuffers        = 1
d3d9.presentInterval       = 1

# ---------- 老游戏兼容项 ----------
# 老引擎用 GetDeviceCaps 探测显存总量，40 系报 12GB 会整数溢出
d3d9.maxAvailableMemory   = 512

# 老引擎依赖 16 位深度格式与 X4R4G4B4 纹理，现代驱动默认已不提供
d3d9.supportDFFormats     = True
d3d9.supportX4R4G4B4      = True
d3d9.supportD16Lockable   = True

# 顶点着色器精度：修正老引擎模型顶点抖动/穿透
d3d9.invariantPosition    = True

# 关闭 DXVK 的采样器替换，老引擎自带的采样状态更稳
d3d9.samplerAnisotropy    = 0
d3d9.forceSamplerTypeSpecConstants = False

# 老游戏 alt-tab 后设备丢失无法恢复，这里关掉该行为
d3d9.deviceLossOnFocusLoss = False

# 伪装成 2006 年代显卡，绕过老引擎的显卡白名单/黑名单
d3d9.customVendorId   = 4318
d3d9.customDeviceId   = 40
d3d9.customDeviceDesc = "NVIDIA GeForce 8800 GTX"

# 老引擎的多显示器枚举方式与现代不同，按单显示器处理更稳
d3d9.enumerateByDisplays = False

# ---------- 其它 ----------
# 允许跨不同格式复制，老引擎常做非常规拷贝
d3d9.allowDiscard        = True
# 老引擎的深度比较精度
d3d9.floatEmulation      = auto
