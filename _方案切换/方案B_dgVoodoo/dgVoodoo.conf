; dgVoodoo2 v2.87.5 configuration for RapeLay (Illusion, 2006, Direct3D9)
; 用途：让 2006 年的老游戏在现代 Windows 11 上稳定运行
;
; 关键设置说明：
;  - OutputAPI = d3d11_fl11_0  → 输出到现代 D3D11，兼容性最好
;  - FullscreenAttributes = fake → 不真的切换显示器分辨率，
;    避免 1280x960 与 2560x1440@165Hz 冲突导致 D3D9 设备丢失而闪退
;  - WindowedAttributes = borderless → 无边框窗口
;  - DisableAltEnterToToggleScreenMode = true → 禁用 Alt+Enter 独占全屏
;  - AppControlledScreenMode = false → 由 dgVoodoo 接管分辨率，忽略游戏请求

[dgVoodoo]
Version                    = 3
OutputAPI                  = d3d11_fl11_0
FullScreenOutput           = default
FullScreenMode             = false
ScalingMode                = stretched_ar
EnumerateRefreshRates      = false
Brightness                 = 1.0
Color                      = 1.0
Contrast                   = 1.0
InheritColorProfileInFullScreenMode = false
KeepWindowAspectRatio      = true
CaptureMouse                = false
CenterAppWindow            = true
DisableAltEnterToToggleScreenMode = true
AppControlledScreenMode     = false
DisableDefaultResolutions   = false
PresentationModel           = flip_discard
ImageScaleFactor            = 1
MSD3DDeviceNames            = false
RTTexturesForceScaleAndMSAA = false

[General]
WindowedAttributes          = borderless
FullscreenAttributes        = fake
EnableGDIHooking            = true
Environment                 =
FPSLimit                    = 60
SystemHookFlags             =
Adapters                    = all
SplashScreen                = false

[DirectX]
VideoMemorySize             = 512
Dithering                   = true
EnableVSync                 = true
Antialiasing                = appdriven
AnisotropicFiltering        = appdriven

[Debug]
Debug                       = false
LogToFile                   = false
MaxTraceLevel               = error
EnableBreak                 = false
